spring:
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        
    consumer:
      group-id: ordersystem-group 
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.example.ordersystem.*"

server:
  port: 8080

springdoc:
  swagger-ui:
    persistAuthorization: true

app:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook:
      secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${STRIPE_CURRENCY:pln}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:8080/swagger-ui/index.html}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8080/swagger-ui/index.html}